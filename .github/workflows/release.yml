name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test dependencies
        run: |
          npm --prefix tests ci
          npx --prefix tests playwright install chromium --with-deps

      - name: Build and verify userscript
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/todoist-keyboard-addons.user.js
            dist/todoist-keyboard-addons.meta.js
          generate_release_notes: true
