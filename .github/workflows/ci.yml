name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright test dependencies
        run: |
          npm --prefix tests ci
          npx --prefix tests playwright install chromium --with-deps

      - name: Build and verify userscript
        run: npm test
